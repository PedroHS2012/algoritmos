<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contar vogais</title>
</head>

<body>
    <h1>Escreva a Frase</h1><br>
    <input type="text" placeholder="Coloque a Frase" id="inputFrase"><br>
    <button onclick="contarVogais()">Contar Vogais</button><br>
    <p id="saida">...</p>
    <script>
        function contarVogais() {
            let frase = document.getElementById('inputFrase').value;
            let contador = 0;
            for (i = 0; i < frase.length; i++) {
                if (frase[i] == 'a' || frase[i] == 'A' || frase[i] == 'e' || frase[i] == 'E' || frase[i] == 'i'
                    || frase[i] == 'I' || frase[i] == 'o' || frase[i] == 'O' || frase[i] == 'u' || frase[i] == 'U') {
                    contador++
                }
            }
            document.getElementById('saida').innerHTML = contador;
        }
    </script>
</body>

</html>
